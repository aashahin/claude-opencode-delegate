name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - name: dist is up to date
        run: bun run build && git diff --exit-code dist/
      - name: OpenCode V2 read-only integration (local mock provider, no API keys)
        run: |
          npm install --global @opencode/cli@2.1.4
          OPENCODE_TEST_BIN="$(command -v opencode)" bun test test/opencode.integration.test.ts
